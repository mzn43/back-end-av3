<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout de Compra</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Checkout de Compra</h1>

        <label for="preco">Preço do Produto (R$):</label>
        <input type="number" id="preco" placeholder="Ex: 100,00">

        <label for="frete">Valor do Frete (R$):</label>
        <input type="number" id="frete" placeholder="Ex: 15,00">

        <h3>Forma de Pagamento:</h3>

        <div class="pagamentos">
            <button class="pix" onclick="calcular('pix')">
                PIX (-10%)
            </button>

            <button class="dinheiro" onclick="calcular('dinheiro')">
                Dinheiro (-5%)
            </button>

            <button class="cartao" onclick="calcular('cartao')">
                Cartão à vista
            </button>

            <button class="parcelado" onclick="calcular('parcelado')">
                Parcelado (+5%)
            </button>
        </div>

        <div class="resultado">
            <p>Forma: <span id="forma">-</span></p>
            <strong>Total: R$ <span id="total">0.00</span></strong>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
